<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #0b1a2e; color: #fff; }
.header {
  background: linear-gradient(135deg, #0b1a2e 0%, #1a3a5c 50%, #0d2137 100%);
  padding: 30px 20px 20px; text-align: center;
  border-bottom: 3px solid #00d4ff;
}
.header h1 { font-size: 28px; font-weight: 800; letter-spacing: 4px; background: linear-gradient(90deg,#00d4ff,#00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header p { color: #8ab4d6; font-size: 14px; margin-top: 6px; letter-spacing: 2px; }
.header .count { display: inline-block; margin-top: 10px; background: rgba(0,212,255,0.15); border: 1px solid rgba(0,212,255,0.3); border-radius: 20px; padding: 4px 18px; font-size: 13px; color: #00d4ff; }
#map { width: 100%; height: 75vh; background: #0b1a2e; }
.info-panel {
  background: linear-gradient(180deg, #0d2137, #0b1a2e);
  padding: 20px;
  border-top: 2px solid rgba(0,212,255,0.15);
}
.info-panel h2 { font-size: 18px; color: #00d4ff; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.info-panel h2::before { content: '🏄'; font-size: 20px; }
.race-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px;
}
.race-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 14px 16px;
  transition: all 0.2s;
}
.race-card:hover { background: rgba(0,212,255,0.06); border-color: rgba(0,212,255,0.25); transform: translateY(-1px); }
.race-card .tag {
  display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 1px;
  padding: 2px 8px; border-radius: 4px; margin-bottom: 6px;
}
.tag-international { background: #ff6b35; color: #fff; }
.tag-national { background: #00b4d8; color: #fff; }
.tag-local { background: #2d6a4f; color: #fff; }
.race-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.race-card .location { font-size: 12px; color: #8ab4d6; margin-bottom: 6px; }
.race-card .location::before { content: '📍 '; }
.race-card .date { font-size: 12px; color: #ffd166; margin-bottom: 6px; }
.race-card .date::before { content: '📅 '; }
.race-card .events { font-size: 12px; color: #aaa; line-height: 1.5; }
.race-card .events::before { content: '🏁 '; }
.race-card .link { display: inline-block; margin-top: 8px; font-size: 11px; color: #00d4ff; text-decoration: none; border-bottom: 1px dotted rgba(0,212,255,0.3); }
.race-card .link:hover { color: #00ff88; border-bottom-color: #00ff88; }
.leaflet-popup-content-wrapper { background: #0d2137 !important; color: #fff !important; border-radius: 10px !important; border: 1px solid rgba(0,212,255,0.2); }
.leaflet-popup-tip { background: #0d2137 !important; }
.leaflet-popup-content { margin: 12px 16px !important; font-family: 'PingFang SC','Microsoft YaHei',sans-serif !important; }
.popup-title { font-size: 15px; font-weight: 700; color: #00d4ff; margin-bottom: 4px; }
.popup-detail { font-size: 12px; color: #ccc; margin: 2px 0; }
.popup-link { display: inline-block; margin-top: 6px; font-size: 11px; color: #00ff88; }
.custom-marker { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #fff; border: 2px solid rgba(255,255,255,0.8); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
.marker-intl { background: #ff6b35; }
.marker-national { background: #00b4d8; }
.marker-local { background: #2d6a4f; }
.legend { position: absolute; bottom: 20px; right: 20px; background: rgba(13,33,55,0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px 14px; font-size: 11px; z-index: 1000; color: #ccc; }
.legend-item { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
@media (max-width: 600px) {
  .header h1 { font-size: 20px; }
  #map { height: 55vh; }
  .race-grid { grid-template-columns: 1fr; }
  .legend { bottom: 10px; right: 10px; font-size: 10px; padding: 8px 10px; }

</style>

  local: { bg: '#2d6a4f', label: '🏟️ 地方联赛' }

  minZoom: 4,

});

const osm = L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
  attribution: '&copy; 高德地图',
  maxZoom: 18,
  opacity: 0.9,
  subdomains: []
});

const satellite = L.tileLayer('https://webst01.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {
  attribution: '&copy; 高德地图',
  maxZoom: 18,
  opacity: 0.9
});

osm.addTo(map);

// 切换底图控件
L.control.layers({
  '🗺️ 地图': osm,
  '🛰️ 卫星': satellite
}, null, { position: 'topleft' }).addTo(map);

// Add markers
races.forEach((r, i) => {
  const color = tagColors[r.tag]?.bg || '#666';
  const marker = L.circleMarker([r.lat, r.lng], {
    radius: 8,
    fillColor: color,
    color: '#fff',
    weight: 2,
    fillOpacity: 0.9
  }).addTo(map);

  const popupContent = `
    <div class="popup-title">${r.name}</div>
    <div class="popup-detail">📍 ${r.city}</div>
    <div class="popup-detail">📅 ${r.date}</div>
    <div class="popup-detail">🏁 ${r.events}</div>
    ${r.link ? `<a class="popup-link" href="${r.link}" target="_blank">🔗 ${r.linkLabel || '详情'} →</a>` : ''}
  `;
  marker.bindPopup(popupContent);
});

// Legend
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <div style="font-weight:700;color:#fff;margin-bottom:4px;font-size:12px;">赛事级别</div>
    <div class="legend-item"><span class="legend-dot" style="background:#ff6b35"></span> 国际赛事</div>
    <div class="legend-item"><span class="legend-dot" style="background:#00b4d8"></span> 国家级</div>
    <div class="legend-item"><span class="legend-dot" style="background:#2d6a4f"></span> 地方联赛</div>
  `;
  return div;
};
legend.addTo(map);

// Fit bounds
const bounds = races.map(r => [r.lat, r.lng]);
map.fitBounds(bounds, { padding: [40, 40] });

// Render race list
const grid = document.getElementById('raceList');
races.forEach(r => {
  const tc = tagColors[r.tag] || { bg: '#666', label: r.tagLabel };
  const card = document.createElement('div');
  card.className = 'race-card';
  card.innerHTML = `
    <span class="tag tag-${r.tag}">${tc.label}</span>
    <h3>${r.name}</h3>
    <div class="location">${r.city}</div>
    <div class="date">${r.date}</div>
    <div class="events">${r.events}</div>
    ${r.link ? `<a class="link" href="${r.link}" target="_blank">🔗 ${r.linkLabel || '报名/详情'} →</a>` : ''}
  `;
  grid.appendChild(card);
});

document.getElementById('raceCount').textContent = `共 ${races.length} 场赛事`;
